<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">90-day modeled contribution by acquisition channel</title>
<desc id="desc">Scenario assumptions, not retail sales. Paid social is negative; referral and organic are positive.</desc>
<rect width="900" height="400" rx="18" fill="#f7f9f8"/>
<text x="48" y="52" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#172c34">UAE coffee app | 90-day acquisition economics</text>
<text x="48" y="81" font-family="Arial, sans-serif" font-size="15" fill="#52646d">AED per acquired customer  •  modeled assumptions, not observed ROI</text>
<line x1="345" y1="113" x2="345" y2="318" stroke="#64747b" stroke-width="1.5"/>
<text x="48" y="153" font-family="Arial, sans-serif" font-size="18" fill="#172c34">Paid social</text>
<rect x="260.32" y="130" width="84.68" height="38" rx="5" fill="#b3584e"/>
<text x="331" y="154" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#152e37">-5.33</text>
<text x="48" y="223" font-family="Arial, sans-serif" font-size="18" fill="#172c34">Referral</text>
<rect x="345.00" y="200" width="121.86" height="38" rx="5" fill="#1f8075"/>
<text x="359" y="224" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#152e37">+7.67</text>
<text x="48" y="293" font-family="Arial, sans-serif" font-size="18" fill="#172c34">Organic</text>
<rect x="345.00" y="270" width="255.00" height="38" rx="5" fill="#1f8075"/>
<text x="359" y="294" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#152e37">+16.05</text>
<text x="48" y="359" font-family="Arial, sans-serif" font-size="12" fill="#52646d">Inputs: config/pilot.json | Modeled first order + scheduled repeat opportunities through day 90</text>
